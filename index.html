<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poezii | Sergiu</title>
    <style>
        /* Schimbare font și fundal */
        body { 
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; 
            background-color: #2b2b2b; 
            color: #e0e0e0; 
            line-height: 1.6; 
            padding: 20px; 
            max-width: 800px; 
            margin: auto; 
        }
        h1 { 
            text-align: center; 
            color: #f1c40f; 
            border-bottom: 1px solid #444; 
            padding-bottom: 10px; 
        }
        .descriere {
            text-align: center;
            margin-bottom: 40px;
            font-style: italic;
        }
        /* Stil pentru butoanele clickabile */
        .buton-volum {
            background-color: #3d3d3d;
            color: #f1c40f;
            border: 1px solid #f1c40f;
            padding: 15px 20px;
            width: 100%;
            font-size: 1.2em;
            font-family: inherit;
            cursor: pointer;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
            text-align: left;
            font-weight: bold;
        }
        .buton-volum:hover {
            background-color: #f1c40f;
            color: #2b2b2b;
        }
        /* Conținutul ascuns inițial */
        .continut-volum {
            display: none; 
            background-color: #333;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 3px solid #f1c40f;
        }
        .poezie { 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>
    <h1>Colecția de Poezii</h1>
    <p class="descriere">Explorări prin acrostihuri, bucle narative conceptuale și motive clasice (Flora, Chloris, Zephyrus).</p>

    <!-- Volumul 18 -->
    <button class="buton-volum" onclick="toggleVolum('volum-18')">18</button>
    <div id="volum-18" class="continut-volum">
        <div class="poezie">
(Inserează textele pentru volumul 18 aici...)
        </div>
    </div>

    <!-- Volumul INFINIT -->
    <button class="buton-volum" onclick="toggleVolum('volum-infinit')">INFINIT</button>
    <div id="volum-infinit" class="continut-volum">
        <div class="poezie">
(Inserează textele pentru volumul INFINIT aici...)
        </div>
    </div>

    <!-- Volumul FLORALIA -->
    <button class="buton-volum" onclick="toggleVolum('volum-floralia')">FLORALIA</button>
    <div id="volum-floralia" class="continut-volum">
        <div class="poezie">
(Inserează aici textele din structura celor șase poeme...)
        </div>
    </div>

    <!-- Script pentru a face butoanele funcționale -->
    <script>
        function toggleVolum(id) {
            var element = document.getElementById(id);
            if (element.style.display === "block") {
                element.style.display = "none";
            } else {
                element.style.display = "block";
            }
        }
    </script>
</body>
</html>
